name: Recall+ CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete application quality gate
        run: npm run check

      - name: Enforce the dependency advisory policy
        run: npm run audit:all

  database:
    name: Supabase migration and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Start the local database
        run: supabase db start

      - name: Apply migrations and run database tests
        run: supabase test db
